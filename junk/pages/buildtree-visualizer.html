<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Build Tree from Preorder + Inorder</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2c; --panel2:#0d1626; --border:#24324d;
    --text:#e2e8f0; --muted:#94a3b8;
    --amber:#f59e0b; --green:#22c55e; --sky:#38bdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 16px 30px}
  h1{margin:0;font-size:20px}
  .sub{margin:4px 0 14px;color:var(--muted);font-size:13px}
  .sub code{background:#1e293b;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11.5px;color:#fbbf24}

  /* layout: left = arrays + tree, right = code */
  .layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
  .leftcol{display:flex;flex-direction:column;gap:12px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0}
  .card-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  svg{width:100%;height:auto;display:block}

  /* arrays */
  .arow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .alab{font:700 11.5px ui-monospace,Menlo,monospace;color:var(--muted);min-width:66px}
  .cells{display:flex;gap:7px}
  .cell{width:48px;height:48px;border-radius:10px;border:1px solid #334155;background:#0f1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 16px ui-monospace,Menlo,monospace;color:#e2e8f0;transition:all .15s}
  .cell small{font-size:9px;color:#475569;font-weight:700}
  .cell.dim{opacity:.3}
  .cell.range{border-color:var(--amber)}
  .cell.rootc{background:#7c2d12;border-color:var(--amber);color:#fde68a;outline:2px solid rgba(245,158,11,.35)}
  .cell.leftc{background:#082f49;border-color:var(--sky);color:#bae6fd}
  .cell.rightc{background:#052e16;border-color:var(--green);color:#bbf7d0}
  .maprow{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .mchip{font:600 11.5px ui-monospace,Menlo,monospace;background:#0d1626;border:1px solid var(--border);border-radius:7px;padding:3px 8px;color:#94a3b8}
  .mchip.fresh{border-color:#fbbf24;color:#fde68a}
  .legend{margin-top:14px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:12px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}

  /* tree */
  .edge{stroke:#334155;stroke-width:2;opacity:0;transition:opacity .3s}
  .edge.built{opacity:1;stroke:var(--sky);stroke-width:2.5}
  .node{fill:#1e293b;stroke:#64748b;stroke-width:2;opacity:0;transition:opacity .3s,fill .2s,stroke .2s}
  .node.built{opacity:1;fill:#0c4a6e;stroke:var(--sky)}
  .node.current{fill:#7c2d12;stroke:var(--amber);stroke-width:4}
  .nval{fill:#f1f5f9;font-weight:700;font-size:19px;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:0;transition:opacity .3s}
  .nval.built{opacity:1}

  /* code */
  #code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 0;overflow:auto;max-height:660px}
  .cl{padding:1.5px 12px 1.5px 8px;white-space:pre}
  .cl .ln{display:inline-block;width:20px;margin-right:12px;text-align:right;color:#475569;user-select:none}
  .cl.hl{background:rgba(245,158,11,.16);box-shadow:inset 3px 0 0 var(--amber)}
  .kw{color:#c084fc} .fn{color:#7dd3fc} .nu{color:#fb923c} .nm{color:#4ade80} .cm{color:#64748b;font-style:italic}

  /* message + controls */
  .msg{margin-top:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 16px;font-size:14.5px;min-height:44px;display:flex;align-items:center;gap:10px}
  .msg::before{content:"💬"}
  .controls{margin-top:10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  button{background:#1e293b;color:var(--text);border:1px solid #334155;border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
  button:hover{background:#273549;border-color:#4a5c7a}
  #bPlay{background:var(--amber);border-color:var(--amber);color:#1f2937;min-width:96px}
  #bPlay:hover{background:#fbbf24}
  #scrub{flex:1;min-width:160px;accent-color:var(--amber);cursor:pointer}
  .counter{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .spd{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
  .spd input{accent-color:var(--amber);width:84px;cursor:pointer}

  @media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏗️ Build Tree from Preorder + Inorder</h1>
  <p class="sub">preorder supplies each subtree's <code>root</code> · inorder decides the <code>split</code> (left of root → left subtree, right of root → right subtree)</p>

  <div class="layout">
    <div class="leftcol">
      <section class="card">
        <div class="card-title">preorder &amp; inorder</div>
        <div class="arow"><span class="alab">preorder</span><div class="cells" id="preCells"></div></div>
        <div class="arow"><span class="alab">inorder</span><div class="cells" id="inCells"></div></div>
        <div class="maprow" id="mapRow"></div>
        <div class="legend">
          <span><i style="background:#7c2d12;border:1px solid var(--amber)"></i>root</span>
          <span><i style="background:#082f49;border:1px solid var(--sky)"></i>left part</span>
          <span><i style="background:#052e16;border:1px solid var(--green)"></i>right part</span>
          <span><i style="background:#0f1a2e;border:1px solid #334155;opacity:.4"></i>outside range</span>
        </div>
      </section>

      <section class="card">
        <div class="card-title">tree being built</div>
        <svg id="tree" viewBox="0 0 820 412" aria-label="tree under construction"></svg>
      </section>
    </div>

    <section class="card">
      <div class="card-title">code</div>
      <div id="code"></div>
    </section>
  </div>

  <div class="msg" id="msg"></div>

  <div class="controls">
    <button id="bReset" title="Reset">⏮</button>
    <button id="bPrev" title="Step back">⏴</button>
    <button id="bPlay" title="Play / Pause">▶ Play</button>
    <button id="bNext" title="Step forward">⏵</button>
    <input type="range" id="scrub" min="-1" max="1" value="-1">
    <span class="counter" id="counter"></span>
    <label class="spd">🐢 <input type="range" id="speed" min="1" max="10" value="6"> 🐇</label>
  </div>
</div>

<script>
'use strict';
/* ================= input (exact vectors from main()) ================= */
const PRE=[3,9,20,15,7], INO=[9,3,15,20,7];
const INMAP={};INO.forEach(function(v,i){INMAP[v]=i;});
const POS={'3':[410,80],'9':[240,210],'20':[580,210],'15':[490,340],'7':[670,340]};

/* ================= trace generation (exact order of the C++ code) ================= */
function buildTrace(){
  const st=[];
  st.push({t:'map'});
  function B(ps,pe,is_,ie){
    st.push({t:'call',ps:ps,pe:pe,is:is_,ie:ie});
    if(ps>pe||is_>ie){ st.push({t:'base',ps:ps,pe:pe}); return null; }
    const val=PRE[ps];
    st.push({t:'pick',val:val,ps:ps});
    const inRoot=INMAP[val],numsLeft=inRoot-is_;
    st.push({t:'split',val:val,inRoot:inRoot,numsLeft:numsLeft,ps:ps,pe:pe,is:is_,ie:ie});
    st.push({t:'goleft',val:val,ps:ps,numsLeft:numsLeft,is:is_,inRoot:inRoot});
    const l=B(ps+1,ps+numsLeft,is_,inRoot-1);
    st.push({t:'attach-left',val:val,child:l});
    st.push({t:'goright',val:val,ps:ps,pe:pe,numsLeft:numsLeft,inRoot:inRoot,ie:ie});
    const r=B(ps+numsLeft+1,pe,inRoot+1,ie);
    st.push({t:'attach-right',val:val,child:r});
    st.push({t:'ret',val:val});
    return val;
  }
  B(0,PRE.length-1,0,INO.length-1);
  st.push({t:'done'});
  return st;
}
const TRACE=buildTrace();
const LAST=TRACE.length-1;

/* line map into the code panel */
const LL={map:3,call:11,base:11,pick:14,split:16,goleft:19,attachL:19,goright:22,attachR:22,ret:24};

/* ================= replay ================= */
function replay(u){
  const grown=new Set(),edgesBuilt=new Set();
  let msg='▶ Play — preorder hands over roots, inorder tells where to split.',
      current=null,banner=false,mapBuilt=false,range=null,rootVal=null,line=-1;
  for(let k=0;k<=u&&k<TRACE.length;k++){
    const s=TRACE[k];
    if(s.t==='map'){
      mapBuilt=true;line=LL.map;
      msg='🗺️ inMap built: value → inorder index → { '+INO.map(function(v,i){return v+'→'+i;}).join(', ')+' }';
    }else if(s.t==='call'){
      range={ps:s.ps,pe:s.pe,is:s.is,ie:s.ie,inRoot:null};rootVal=null;line=LL.call;
      msg='📞 build(pre '+s.ps+'..'+s.pe+', in '+s.is+'..'+s.ie+')';
    }else if(s.t==='base'){
      line=LL.base;
      msg='🛑 empty slice (pre '+s.ps+' > '+s.pe+') → return nullptr';
    }else if(s.t==='pick'){
      grown.add(String(s.val));current=String(s.val);rootVal=s.val;line=LL.pick;
      msg='🌱 root = preorder['+s.ps+'] = '+s.val;
    }else if(s.t==='split'){
      range={ps:s.ps,pe:s.pe,is:s.is,ie:s.ie,inRoot:s.inRoot};line=LL.split;
      msg='🔎 inMap['+s.val+'] = '+s.inRoot+' → numsLeft = '+s.numsLeft+' → '+s.numsLeft+' left, '+(s.ie-s.inRoot)+' right';
    }else if(s.t==='goleft'){
      line=LL.goleft;
      msg='⬇️ build LEFT subtree: pre '+(s.ps+1)+'..'+(s.ps+s.numsLeft)+', in '+s.is+'..'+(s.inRoot-1);
    }else if(s.t==='attach-left'){
      if(s.child!=null)edgesBuilt.add(s.val+'>'+s.child);
      current=String(s.val);line=LL.attachL;
      msg='🔗 attach '+(s.child!=null?s.child:'NULL')+' as '+s.val+'’s left child';
    }else if(s.t==='goright'){
      line=LL.goright;
      msg='⬇️ build RIGHT subtree: pre '+(s.ps+s.numsLeft+1)+'..'+s.pe+', in '+(s.inRoot+1)+'..'+s.ie;
    }else if(s.t==='attach-right'){
      if(s.child!=null)edgesBuilt.add(s.val+'>'+s.child);
      current=String(s.val);line=LL.attachR;
      msg='🔗 attach '+(s.child!=null?s.child:'NULL')+' as '+s.val+'’s right child';
    }else if(s.t==='ret'){
      line=LL.ret;
      msg='↩️ subtree rooted at '+s.val+' complete';
    }else if(s.t==='done'){
      banner=true;current=null;range=null;rootVal=null;line=-1;
      msg='🏁 Done! Tree built — inorder check: '+INO.join(' ')+' ✓ (matches the input)';
    }
  }
  return {grown:grown,edgesBuilt:edgesBuilt,msg:msg,current:current,banner:banner,mapBuilt:mapBuilt,range:range,rootVal:rootVal,line:line};
}

/* ================= code panel ================= */
const CODE=[
  '<span class="kw">TreeNode</span>* <span class="fn">buildTree</span>(<span class="kw">vector</span>&lt;<span class="kw">int</span>&gt;&amp; preorder, <span class="kw">vector</span>&lt;<span class="kw">int</span>&gt;&amp; inorder) {',
  '    <span class="kw">map</span>&lt;<span class="kw">int</span>, <span class="kw">int</span>&gt; inMap;',
  '    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="nm">0</span>; i &lt; inorder.size(); i++)',
  '        inMap[inorder[i]] = i;          <span class="cm">// value → inorder index</span>',
  '    <span class="kw">return</span> <span class="fn">build</span>(preorder, <span class="nm">0</span>, preorder.size()-<span class="nm">1</span>,',
  '                   inorder,  <span class="nm">0</span>, inorder.size()-<span class="nm">1</span>, inMap);',
  '}',
  '',
  '<span class="kw">TreeNode</span>* <span class="fn">build</span>(<span class="kw">vector</span>&lt;<span class="kw">int</span>&gt;&amp; preorder, <span class="kw">int</span> preStart, <span class="kw">int</span> preEnd,',
  '                 <span class="kw">vector</span>&lt;<span class="kw">int</span>&gt;&amp; inorder, <span class="kw">int</span> inStart, <span class="kw">int</span> inEnd,',
  '                 <span class="kw">map</span>&lt;<span class="kw">int</span>, <span class="kw">int</span>&gt;&amp; inMap) {',
  '    <span class="kw">if</span> (preStart &gt; preEnd || inStart &gt; inEnd) <span class="kw">return</span> <span class="nu">nullptr</span>;',
  '',
  '    TreeNode* root = <span class="kw">new</span> <span class="fn">TreeNode</span>(preorder[preStart]);',
  '    <span class="kw">int</span> inRoot   = inMap[root-&gt;val];',
  '    <span class="kw">int</span> numsLeft = inRoot - inStart;',
  '',
  '    root-&gt;left  = <span class="fn">build</span>(preorder, preStart+<span class="nm">1</span>, preStart+numsLeft,',
  '                          inorder,  inStart, inRoot-<span class="nm">1</span>, inMap);',
  '    root-&gt;right = <span class="fn">build</span>(preorder, preStart+numsLeft+<span class="nm">1</span>, preEnd,',
  '                          inorder,  inRoot+<span class="nm">1</span>, inEnd, inMap);',
  '    <span class="kw">return</span> root;',
  '}'];

/* ================= DOM ================= */
if(typeof document!=='undefined'){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('tree');
function E(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);if(parent)parent.appendChild(el);return el;}

const gE=E('g',{},svg),gN=E('g',{},svg);
/* pre-create all edges (revealed when attached) */
const edgeEls={};
(function reveal(ps,pe,is_,ie,parent){
  if(ps>pe||is_>ie)return;
  const val=PRE[ps],inRoot=INMAP[val],numsLeft=inRoot-is_;
  if(parent!=null){
    const p1=POS[String(parent)],p2=POS[String(val)];
    const ln=E('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],class:'edge'},gE);
    edgeEls[parent+'>'+val]=ln;
  }
  reveal(ps+1,ps+numsLeft,is_,inRoot-1,val);
  reveal(ps+numsLeft+1,pe,inRoot+1,ie,val);
})(0,PRE.length-1,0,INO.length-1,null);
const nodeEls={};
for(const id in POS){
  const p=POS[id],g=E('g',{},gN);
  const c=E('circle',{cx:p[0],cy:p[1],r:26,class:'node'},g);
  const t=E('text',{x:p[0],y:p[1],class:'nval'},g);t.textContent=id;
  nodeEls[id]={c:c,t:t};
}

const codeBox=document.getElementById('code');
CODE.forEach(function(h,i){
  const d=document.createElement('div');d.className='cl';d.id='cl'+i;
  d.innerHTML='<span class="ln">'+(i+1)+'</span><span class="lt">'+h+'</span>';
  codeBox.appendChild(d);
});

const preCells=document.getElementById('preCells'),inCells=document.getElementById('inCells'),
      mapRow=document.getElementById('mapRow'),msgEl=document.getElementById('msg'),
      counterEl=document.getElementById('counter'),scrub=document.getElementById('scrub'),
      bPlay=document.getElementById('bPlay');
scrub.max=String(LAST);

function cellClass(arr,i,st){
  const r=st.range;
  if(!r||st.banner)return '';
  const lo=arr==='pre'?r.ps:r.is, hi=arr==='pre'?r.pe:r.ie;
  if(i<lo||i>hi)return ' dim';
  if(arr==='pre')return (i===r.ps&&st.rootVal!=null)?' rootc':' range';
  if(r.inRoot==null)return ' range';
  if(i===r.inRoot)return ' rootc';
  return i<r.inRoot?' leftc':' rightc';
}

let idx=-1,playing=false,timer=null;
const delay=()=>1650-Number(document.getElementById('speed').value)*155;

function render(){
  const st=replay(idx);
  /* arrays */
  preCells.innerHTML='';
  PRE.forEach(function(v,i){
    const d=document.createElement('div');
    d.className='cell'+cellClass('pre',i,st);
    d.innerHTML='<span>'+v+'</span>';
    preCells.appendChild(d);
  });
  inCells.innerHTML='';
  INO.forEach(function(v,i){
    const d=document.createElement('div');
    d.className='cell'+cellClass('in',i,st);
    d.innerHTML='<span>'+v+'</span><small>'+(st.mapBuilt?i:'·')+'</small>';
    inCells.appendChild(d);
  });
  mapRow.innerHTML='<span class="alab">inMap</span>';
  if(!st.mapBuilt){
    mapRow.innerHTML+='<span class="mchip">building…</span>';
  }else{
    INO.forEach(function(v,i){
      const c=document.createElement('span');
      c.className='mchip'+(st.rootVal===v?' fresh':'');
      c.textContent=v+' → '+i;
      mapRow.appendChild(c);
    });
  }
  /* tree */
  for(const id in nodeEls){
    const el=nodeEls[id],built=st.grown.has(id);
    el.c.setAttribute('class','node'+(built?' built':'')+(built&&st.current===id?' current':''));
    el.t.setAttribute('class','nval'+(built?' built':''));
  }
  for(const key in edgeEls){
    edgeEls[key].setAttribute('class','edge'+(st.edgesBuilt.has(key)?' built':''));
  }
  /* code highlight */
  for(let i=0;i<CODE.length;i++)document.getElementById('cl'+i).classList.toggle('hl',st.line===i);
  /* text */
  msgEl.textContent=st.msg;
  counterEl.textContent=(idx+1)+' / '+TRACE.length;
  scrub.value=String(idx);
  bPlay.textContent=playing?'⏸ Pause':'▶ Play';
}

function setIdx(v){idx=Math.max(-1,Math.min(LAST,v));render();}
function stopPlay(){if(playing){playing=false;clearTimeout(timer);render();}}
function play(){if(idx>=LAST)setIdx(-1);playing=true;render();timer=setTimeout(tick,delay());}
function tick(){if(!playing)return;if(idx>=LAST){stopPlay();return;}setIdx(idx+1);timer=setTimeout(tick,delay());}
bPlay.onclick=function(){playing?stopPlay():play();};
document.getElementById('bReset').onclick=function(){stopPlay();setIdx(-1);};
document.getElementById('bPrev').onclick=function(){stopPlay();setIdx(idx-1);};
document.getElementById('bNext').onclick=function(){stopPlay();setIdx(idx+1);};
scrub.addEventListener('input',function(){stopPlay();setIdx(Number(scrub.value));});
document.getElementById('speed').addEventListener('input',function(){
  if(playing){clearTimeout(timer);timer=setTimeout(tick,delay());}
});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();playing?stopPlay():play();}
  else if(e.key==='ArrowRight'){e.preventDefault();stopPlay();setIdx(idx+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();stopPlay();setIdx(idx-1);}
});
render();
}
</script>
</body>
</html>
